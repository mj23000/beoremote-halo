[project]
name = "beoremote-halo"
version = "2.0.0"
description = "Halo API client"
authors = [{ name = "Bang & Olufsen", email = "support@bang-olufsen.dk" }]
readme = "README.md"
keywords = ["AsyncAPI", "Halo API"]
requires-python = ">=3.11"
# Minimum versions are verified in CI. aiohttp and zeroconf require the first releases without known vulnerabilities
dependencies = [
    "aiohttp>=3.14.4,<4",
    "pydantic>=2.13.4,<3",
    "zeroconf>=0.149.16,<1",
]

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia",
    "Intended Audience :: Developers",
]

[project.license]
text = "MIT"

[project.urls]
homepage = "https://pypi.org/project/beoremote-halo/"
documentation = "https://bang-olufsen.github.io/beoremote-halo/"
repository = "https://github.com/bang-olufsen/beoremote-halo"
"Bug Tracker" = "https://github.com/bang-olufsen/beoremote-halo/issues"

[project.scripts]
beoremote-halo = "beoremote_halo.cli:main"

[dependency-groups]
# Pinned for reproducible checks. Also used by the hooks in .pre-commit-config.yaml
dev = [
    "prek==0.5.5",
    "pytest==9.1.1",
    "pytest-aiohttp==1.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "ty==0.0.86",
]


[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.pytest]
asyncio_mode = "auto"
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["beoremote_halo"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true


[tool.ruff]
line-length = 140

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = true

select = [
    "ALL",
    "docstring-extraneous-parameter",
    "docstring-missing-returns",
    "docstring-extraneous-returns",
    "docstring-missing-yields",
    "docstring-extraneous-yields",
    "docstring-missing-exception",
    "docstring-extraneous-exception",
]
ignore = [
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "boolean-positional-value-in-call",
    "too-many-arguments",
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    "missing-copyright-notice",
    "missing-blank-line-after-last-section",
    "too-many-positional-arguments",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["assert"]
# The CLI prints its output
"beoremote_halo/cli/*" = ["print"]

[tool.uv]
# Only use releases that have been available for at least two weeks, like Dependabot's cooldown
exclude-newer = "2 weeks"

[tool.uv.build-backend]
module-root = ""
