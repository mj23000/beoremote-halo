[project]
name = "beoremote-halo"
version = "2.0.0"
description = "Halo API client"
authors = [{ name = "Bang & Olufsen", email = "support@bang-olufsen.dk" }]
readme = "README.md"
keywords = ["AsyncAPI", "Halo API"]
requires-python = ">=3.11"
dependencies = [
    "aioconsole>=0.4.1",
    "aiohttp>=3.11.0,<4.0.0",
    "pydantic>=2.13.4",
    "zeroconf>=0.25.1,<1.0.0",
]

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia",
    "Intended Audience :: Developers",
]

[project.license]
text = "MIT"

[project.urls]
homepage = "https://pypi.org/project/beoremote-halo/"
documentation = "https://bang-olufsen.github.io/beoremote-halo/"
repository = "https://github.com/bang-olufsen/beoremote-halo"
"Bug Tracker" = "https://github.com/bang-olufsen/beoremote-halo/issues"

[project.scripts]
halo_api = "halo_api.halo_cli:HaloApiCli"

[dependency-groups]
dev = [
    "prek>=0.4.1",
    "pytest>=9.0.3",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff==0.15.13",
    "ty==0.0.38",
]


[build-system]
requires = ["uv_build >= 0.11.5, <0.12.0"]
build-backend = "uv_build"

[tool.pytest]
asyncio_mode = "auto"


[tool.ruff]
line-length = 140

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = true

select = [
    "ALL",
    "DOC102",
    "DOC201",
    "DOC202",
    "DOC402",
    "DOC403",
    "DOC501",
    "DOC502",
]
ignore = [
    "FBT001",
    "FBT002",
    "FBT003",
    "PLR0913",
    "D203",
    "D213",
    "CPY001",
    "D413",
    "PLR0917",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.uv.build-backend]
module-root = ""
